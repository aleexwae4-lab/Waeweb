openapi: 3.1.0
info:
  title: WAEWEB Connect API
  version: 1.0.0-rc.7
  description: >
    Opt-in server-to-server public web search and SSE. No remote Chromium,
    no browser-visible credentials and no production deployment.
servers:
  - url: https://YOUR-VERIFIED-WAEWEB-BACKEND.example.org
security:
  - BearerToken: []
    ClientId: []
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: Server-only random per-client token.
    ClientId:
      type: apiKey
      in: header
      name: X-WAEWEB-Client
  schemas:
    SearchInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 2, maxLength: 180}
        type:
          type: string
          enum: [all, research, books, news, videos, images]
        fresh:
          type: boolean
          description: Bypass WAEWEB in-process result cache; upstream freshness is not guaranteed.
    RetrieveInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, maxLength: 1800}
    Result:
      type: object
      properties:
        title: {type: string}
        url: {type: string, format: uri}
        snippet: {type: string}
        source: {type: string}
        date: {type: [string, "null"]}
        image: {type: [string, "null"]}
    SearchOutput:
      type: object
      required: [ok, contract, results, sources, failedSources, fetchedAt]
      properties:
        ok: {const: true}
        contract: {const: waeweb-connect/v1}
        status:
          type: string
          enum: [complete, partial]
          description: >
            Complete means available sources answered, including zero hits.
            Partial means at least one source failed or was not configured.
        query: {type: string}
        type: {type: string}
        results:
          type: array
          items: {$ref: "#/components/schemas/Result"}
        sources: {type: array, items: {type: string}}
        failedSources: {type: array, items: {type: string}}
        fetchedAt: {type: string, format: date-time}
        freshness: {type: string}
        brief:
          type: [object, "null"]
          description: Bounded extractive source-attributed notes, never independent verification.
        disclaimer: {type: string}
paths:
  /api/connect/v1/status:
    get:
      summary: Authenticated client capability check
      responses:
        "200": {description: Connected}
        "401": {description: Invalid machine credentials}
        "503": {description: Connect disabled}
  /api/connect/v1/search:
    post:
      summary: Live-request public web search
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchInput"}
      responses:
        "200":
          description: Search result set with sources
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchOutput"}
        "401": {description: Invalid credentials}
        "422": {description: Rejected query}
        "429": {description: Shared PostgreSQL per-client quota or concurrency admission}
        "502": {description: Search operation failed}
        "503": {description: No configured and responding sources; not a successful zero-hit search}
  /api/connect/v1/stream:
    post:
      summary: SSE ready, results/error, done; NOT remote browsing pixels
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchInput"}
      responses:
        "200":
          description: Server-sent ready then results/error and terminal done (false for unavailable sources)
          content:
            text/event-stream:
              schema: {type: string}
  /api/connect/v1/retrieve:
    post:
      summary: Explicit opt-in public HTTPS text extraction, not indexed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetrieveInput"}
      responses:
        "200": {description: Authenticated extracted text}
        "422": {description: URL, DNS, robots or media policy rejected}
        "503": {description: Reader feature disabled}
