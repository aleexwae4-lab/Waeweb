name: WAEWEB Render Live Public Check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: waeweb-live-public
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the live Git-deployed production API and essential scripts
        env:
          WAEWEB_BASE_URL: https://waeweb.onrender.com
          WAEWEB_EXPECT_VERSION: 1.0.0-rc.35
        run: node scripts/live-public-smoke.mjs
