name: WAEWEB Native Chromium Smoke

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/native-smoke.yml"

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: Real Electron startup + preload + IPC
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional desktop engine
        run: npm install --no-audit --no-fund
      - name: Download actual Chromium binary before configuring sandbox
        run: ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron --version
      - name: Configure Chromium SUID sandbox on Linux runner
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c %a node_modules/electron/dist/chrome-sandbox)" = "4755"
      - name: Verify sources and unit security checks
        run: npm run check && npm test
      - name: Launch actual Chromium in a virtual display
        run: xvfb-run -a timeout 90s npm run desktop:smoke
